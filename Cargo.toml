[package]
name = "rustedpaint"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustedpaint"
path = "src/lib.rs"

[features]
desktop = ["dep:eframe"]

[dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
img_core = { package = "jflib-img-core", version = "0.2.1" }
img_pdn = { package = "jflib-img-pdn", version = "0.2.1" }
jflib-plat = { version = "0.2.1", features = ["std"] }
png = "0.18.1"
